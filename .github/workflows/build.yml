name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'charly release CalVer to package (e.g. 2026.227.1026)'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download charly release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin plugins
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-linux-*' --dir bin
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-plugins-linux-*.tar.gz' --dir .
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-candy-charly.yml' --dir .
          for arch in amd64 arm64; do
            mkdir -p plugins/$arch
            tar -xzf charly-plugins-linux-$arch.tar.gz -C plugins/$arch
          done

      - name: Install charly + baked generate-packages plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -Dm755 bin/charly-amd64 /usr/local/bin/charly
          install -Dm644 plugins/amd64/*.providers /usr/lib/charly/plugins/
          install -Dm755 plugins/amd64/plugin-* /usr/lib/charly/plugins/
          mkdir -p /tmp/plugin
          gh release download --repo opencharly/plugin-generate-packages \
            --pattern 'generate-packages-linux-amd64' \
            --pattern 'generate-packages.providers' --dir /tmp/plugin
          install -Dm755 /tmp/plugin/generate-packages-linux-amd64 /usr/lib/charly/plugins/generate-packages
          install -Dm644 /tmp/plugin/generate-packages.providers /usr/lib/charly/plugins/generate-packages.providers
          charly version

      - name: Write the usign signing key
        run: |
          echo "${{ secrets.USIGN_PRIVATE_KEY }}" | base64 -d > charly.usign-secret
          chmod 600 charly.usign-secret

      - name: Build packages
        env:
          CHARLY_PROJECT_DIR: ${{ github.workspace }}
        run: |
          for variant in default full minimal; do
            for arch in amd64 arm64; do
              charly generate-packages \
                --candy charly-candy-charly.yml \
                --binary bin/charly-$arch \
                --plugins plugins/$arch \
                --version ${{ inputs.version }} \
                --arch $arch \
                --variant $variant \
                --formats ipk \
                --out repo/$arch
            done
          done

      - name: Assemble + sign the opkg feed
        run: |
          # The Packages index is generated by the vendored make-index.sh
          # (mirrors OpenWrt's ipkg-make-index.sh); usign comes from the pinned
          # OpenWrt container image, so nothing is fetched or compiled.
          for arch in amd64 arm64; do
            cd repo/$arch
            bash "${{ github.workspace }}/scripts/make-index.sh" . > Packages
            gzip -k Packages
            cd "${{ github.workspace }}"
          done
          docker run --rm -v "${{ github.workspace }}:/ws:rw" openwrt/rootfs:x86-64-24.10.8 sh -c '
            set -e
            for arch in amd64 arm64; do
              cd /ws/repo/$arch
              usign -S -m Packages -s /ws/charly.usign-secret
            done
          '

      - name: Create stable copies
        run: |
          for arch in amd64 arm64; do
            newest=$(ls repo/$arch/charly_*_$arch.ipk | grep -v minimal | grep -v full | sort -V | tail -1)
            cp "$newest" repo/$arch/charly-$arch.ipk
          done

      - name: Install-test
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # opkg-key names trusted keys by the usign fingerprint and verifies
          # Packages.sig against the decompressed Packages. OpenWrt has no
          # podman/qemu/libvirt in its repos, so full charly functionality is
          # not expected — the test asserts the .ipk installs and the binary
          # runs (charly version).
          docker run --rm -v "${{ github.workspace }}:/ws:ro" openwrt/rootfs:x86-64-24.10.8 sh -c '
            set -e
            mkdir -p /var/lock /etc/opkg/keys
            fp=$(usign -F -p /ws/charly.pub)
            cp /ws/charly.pub /etc/opkg/keys/$fp
            echo "src/gz charly file:///ws/amd64" > /etc/opkg/customfeeds.conf
            opkg update
            opkg install charly
            test "$(charly version)" = "$VERSION" || { echo "version mismatch: $(charly version) != $VERSION"; exit 1; }
          '

      - name: Deploy to Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - name: Deploy
        uses: actions/deploy-pages@v4
